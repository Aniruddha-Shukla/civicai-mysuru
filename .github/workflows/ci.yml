name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database only — not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicai_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/civicai_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy
      - name: Test (unit + PostgreSQL integration)
        run: npm run test
      - name: Build
        run: npm run build
      - name: Secret scan (git + client bundle)
        run: npm run check:secrets
